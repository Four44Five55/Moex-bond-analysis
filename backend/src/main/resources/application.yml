server:
  port: 8090

spring:
  application:
    name: moex-analytics

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5445}/${DB_NAME:moex}
    username: ${DB_USER:moex}
    password: ${DB_PASSWORD:moex}

  jpa:
    hibernate:
      ddl-auto: none          # схемой управляет Flyway
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  cache:
    type: redis
    redis:
      time-to-live: 300000     # 5 минут по умолчанию

  jackson:
    serialization:
      write-dates-as-timestamps: false
      # Денежные суммы — BigDecimal. Без этого Jackson вправе вывести их в экспоненциальной
      # форме (1.5E+7), а JSON.parse на фронте такое число прочитает, но в вёрстку оно
      # попадёт как «1.5e+7». Плоская запись гарантирует обычные 15000000.00.
      write-bigdecimal-as-plain: true

# Настройки приложения
app:
  tax:
    # Запасная ключевая ставка: берётся, только если веб-сервис ЦБ недоступен.
    # В норме максимум за год приходит из ЦБ (см. cbr.service-url).
    key-rate-fallback-pct: ${KEY_RATE_PCT:16.0}

  cors:
    # Vite dev/preview. Переопределяется переменной CORS_ORIGINS (через запятую) при выносе с localhost.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5180,http://localhost:4180}

moex:
  base-url: https://iss.moex.com/iss
  sync:
    enabled: true
    cron: "0 */15 * * * *"      # каждые 15 минут
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 20000
    max-retries: 3

# Ключевая ставка ЦБ — нужна вычету по вкладам; в MOEX ISS её нет
cbr:
  service-url: https://www.cbr.ru/DailyInfoWebServ/DailyInfo.asmx
  timeout-ms: 15000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.example: INFO
